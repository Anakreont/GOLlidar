<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="774" viewBox="0 0 680 516" font-family="Arial, Helvetica, sans-serif">
<title>Schemat połączeń skanera</title>
<style>
.th{font-size:14px;font-weight:600;fill:#222}.ts{font-size:12px;fill:#555}
.l{stroke:#444;stroke-width:1.5;fill:none}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.purple rect{fill:#EEEDFE;stroke:#534AB7}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5"/></marker></defs>
<rect width="680" height="516" fill="#fff"/>
<rect x="32" y="40" width="616" height="146" rx="8" fill="none" stroke="#888" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="th" x="48" y="64">Głowica na górze monopodu</text>
<g class="teal"><rect x="48" y="90" width="110" height="56" rx="8"/><text class="th" x="103" y="113" text-anchor="middle">LiDAR D500</text><text class="ts" x="103" y="132" text-anchor="middle">skaner 360°</text></g>
<g class="gray"><rect x="180" y="90" width="124" height="56" rx="8"/><text class="th" x="242" y="113" text-anchor="middle">Adapter USB</text><text class="ts" x="242" y="132" text-anchor="middle">z zestawu D500</text></g>
<g class="teal"><rect x="328" y="90" width="144" height="56" rx="8"/><text class="th" x="400" y="113" text-anchor="middle">BNO085</text><text class="ts" x="400" y="132" text-anchor="middle">czujnik przechyłu</text></g>
<g class="gray"><rect x="494" y="90" width="136" height="56" rx="8"/><text class="th" x="562" y="113" text-anchor="middle">Konwerter UART</text><text class="ts" x="562" y="132" text-anchor="middle">zworka na 3,3 V</text></g>
<line class="l" x1="158" y1="118" x2="180" y2="118"/><line class="l" x1="472" y1="118" x2="494" y2="118"/>
<text class="ts" x="169" y="168" text-anchor="middle">przewód 4-pin</text>
<text class="ts" x="483" y="168" text-anchor="middle">4 przewody</text>
<line class="l" x1="242" y1="146" x2="242" y2="290"/><text class="ts" x="254" y="244">USB-A → microUSB, 1 m</text>
<path class="l" d="M562 146 L562 230 L400 230 L400 290"/><text class="ts" x="412" y="264">USB-A → USB-C, 1 m</text>
<g class="purple"><rect x="180" y="290" width="260" height="56" rx="8"/><text class="th" x="310" y="313" text-anchor="middle">Raspberry Pi 3B+</text><text class="ts" x="310" y="332" text-anchor="middle">na monopodzie, ok. 1,1 m</text></g>
<g class="teal"><rect x="490" y="290" width="150" height="56" rx="8"/><text class="th" x="565" y="313" text-anchor="middle">BMP280</text><text class="ts" x="565" y="332" text-anchor="middle">piny GPIO 1, 3, 5, 6</text></g>
<line class="l" x1="440" y1="318" x2="490" y2="318"/>
<line class="l" x1="310" y1="420" x2="310" y2="356" marker-end="url(#a)"/><text class="ts" x="322" y="392">USB-A → microUSB, krótki (zasilanie)</text>
<g class="gray"><rect x="180" y="420" width="260" height="56" rx="8"/><text class="th" x="310" y="443" text-anchor="middle">Powerbank</text><text class="ts" x="310" y="462" text-anchor="middle">wyjście min. 2,4 A</text></g>
</svg>
